<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SS Property{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='portal-overrides.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='team-images.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='about-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='resources-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='postal-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared-listings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='listing-size-final.css', v='2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site-consistency.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='header-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='team-photo-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='detail-wireframe.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='alignment-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='services-alignment-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ux-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='listing-toolbar-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-detail.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-enquiry.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-map.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-floor-plan.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-overview.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-overview-polish.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='overview-bullets.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-overview-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='property-dark-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='toolbar-alignment-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='listing-layout-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='listing-unified-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='contact-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='luxury-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='blue-luxury-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='black-gold-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dark-luxury-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dark-scrollbar-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared-dark-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='about-dark-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dark-header-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='gold-tab-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dark-filter-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='farrer-photo-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='resources-dark-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='logo-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='header-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile-final.css') }}">
</head>
<body class="property-portal">
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="SS Property"><img class="brand-logo" src="{{ url_for('static', filename='img/ssPropertyLOGO.png') }}" alt="SS Property"></a>
        <div class="mobile-header-tools">
            <button class="mobile-search-toggle" type="button" aria-controls="site-search" aria-expanded="false" aria-label="Open search">⌕</button>
            <button class="language-toggle" type="button" aria-label="Switch language" data-language="en"><span>EN</span><span>中文</span></button>
        </div>
        <button class="mobile-menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button>
        <nav class="main-nav" id="main-navigation" aria-label="Main navigation">
            {% for label, endpoint in nav_items %}
            <a class="{% if active_page == endpoint %}active{% endif %}" href="{{ url_for(endpoint) }}">{{ label }}</a>
            {% endfor %}
            <a class="mobile-menu-action" href="{{ url_for('contact') }}">Book a conversation <span>↗</span></a>
        </nav>
        <a class="header-action" href="{{ url_for('contact') }}">Book a conversation <span>↗</span></a>
    </header>
    <form class="site-search" id="site-search" action="{{ url_for('listings') }}" method="get" role="search">
        <label for="site-search-input">Search properties</label>
        <input id="site-search-input" name="q" type="search" placeholder="Search by name, district or property type" autocomplete="off">
        <button type="submit" aria-label="Search properties">↗</button>
    </form>
    <main>{% block content %}{% endblock %}</main>
    {% if active_page not in ['home', 'postal-districts'] %}{% include '_just_listed.html' %}{% endif %}
    <footer class="site-footer">
        <div class="brand footer-brand"><img class="brand-logo" src="{{ url_for('static', filename='img/ssPropertyLOGO.png') }}" alt="SS Property"></div>
        <p>Property for better living.</p>
        <small>© 2026 SS Property</small>
    </footer>
    <script>
        const searchToggle = document.querySelector('.mobile-search-toggle');
        const siteSearch = document.querySelector('.site-search');
        searchToggle?.addEventListener('click', () => {
            const isOpen = searchToggle.getAttribute('aria-expanded') === 'true';
            searchToggle.setAttribute('aria-expanded', String(!isOpen));
            siteSearch?.classList.toggle('is-open', !isOpen);
            if (!isOpen) document.querySelector('#site-search-input')?.focus();
        });

            const scrollBefore = window.scrollY;
            const mainBefore = document.querySelector('main')?.getBoundingClientRect().top;
        const languageToggle = document.querySelector('.language-toggle');
        const languageLabels = {
            en: { 'all-listings': 'All Listings', 'new-launches': 'New Launches', services: 'Services', resources: 'Resources', 'about-us': 'About Us', contact: 'Contact', action: 'Book a conversation' },
            zh: { 'all-listings': '所有房源', 'new-launches': '新楼盘', services: '服务', resources: '资讯', 'about-us': '关于我们', contact: '联系我们', action: '预约咨询' }
        };
        const pageTranslations = {
            'Brand-New Landed Properties For Sale in Singapore': '新加坡全新有地房产',
            'Just Listed Properties For Sale': '最新上市房源',
            'Featured Resale Listings': '精选转售房源',
            'Featured properties for sale.': '精选房源',
            'Just listed properties for sale.': '最新上市房源',
            'Explore our selection of homes across Singapore, chosen for their location, quality and potential.': '探索我们精选的新加坡房源，兼顾地段、品质与发展潜力。',
            'Browse our latest new launch homes and developments.': '浏览我们最新推出的住宅与楼盘。',
            'View all new launches': '查看所有新楼盘',
            'View all listings': '查看所有房源',
            'View all resale homes': '查看所有转售住宅',
            'Find my property': '寻找我的理想房产',
            'Search properties': '搜索房产',
            'District': '区域',
            'Property type': '房产类型',
            'All districts': '所有区域',
            'All property types': '所有房产类型',
            'Property for better living.': '为更美好的生活寻找理想房产。'
        };
        const originalPageText = new Map();
        const languageElements = document.querySelectorAll('h1, h2, .button, .listing-page-head p:last-child, .listing-toolbar strong, .district-filter label, .site-search label, .site-footer p');
        languageElements.forEach(element => {
            originalPageText.set(element, element.matches('.button') ? element.firstChild.textContent.trim() : element.textContent.trim());
        });
        const reserveLanguageSpace = () => {
            languageElements.forEach(element => {
                const original = originalPageText.get(element);
                const translation = pageTranslations[original];
                if (!translation || element.dataset.languageSpaceReserved) return;
                const originalHeight = element.getBoundingClientRect().height;
                const originalWidth = element.getBoundingClientRect().width;
                const textNode = element.matches('.button') ? element.firstChild : element;
                const originalText = textNode.textContent;
                textNode.textContent = translation;
                const translatedHeight = element.getBoundingClientRect().height;
                const translatedWidth = element.getBoundingClientRect().width;
                textNode.textContent = originalText;
                element.style.minHeight = `${Math.ceil(Math.max(originalHeight, translatedHeight))}px`;
                if (element.matches('.button')) {
                    const stableWidth = `${Math.ceil(Math.max(originalWidth, translatedWidth))}px`;
                    element.style.minWidth = stableWidth;
                    element.style.width = stableWidth;
                }
                element.dataset.languageSpaceReserved = 'true';
            });
            document.querySelectorAll('.main-nav > a:not(.mobile-menu-action)').forEach(link => {
                if (link.dataset.languageSpaceReserved) return;
                const endpoint = link.getAttribute('href')?.split('/').pop();
                const english = languageLabels.en[endpoint];
                const chinese = languageLabels.zh[endpoint];
                if (!english || !chinese) return;
                const original = link.textContent;
                const originalWidth = link.getBoundingClientRect().width;
                link.textContent = chinese;
                const translatedWidth = link.getBoundingClientRect().width;
                link.textContent = original;
                link.style.minWidth = `${Math.ceil(Math.max(originalWidth, translatedWidth))}px`;
                link.dataset.languageSpaceReserved = 'true';
            });
        };
        reserveLanguageSpace();
        const setLanguage = nextLanguage => {
            languageToggle.dataset.language = nextLanguage;
            document.documentElement.lang = nextLanguage === 'zh' ? 'zh-CN' : 'en';
            const labels = languageLabels[nextLanguage];
            document.querySelectorAll('.main-nav > a:not(.mobile-menu-action)').forEach(link => {
                const endpoint = link.getAttribute('href')?.split('/').pop();
                if (endpoint && labels[endpoint]) link.textContent = labels[endpoint];
            });
            document.querySelectorAll('.header-action, .mobile-menu-action').forEach(link => {
                link.firstChild.textContent = labels.action;
            });
            document.querySelectorAll('h1, h2, .button, .listing-page-head p:last-child, .listing-toolbar strong, .district-filter label, .site-search label, .site-footer p').forEach(element => {
                const original = originalPageText.get(element);
                if (!original) return;
                const translation = pageTranslations[original];
                if (nextLanguage === 'zh' && translation) {
                    if (element.matches('.button')) element.firstChild.textContent = translation;
                    else element.textContent = translation;
                } else if (nextLanguage === 'en') {
                    if (element.matches('.button')) element.firstChild.textContent = original;
                    else element.textContent = original;
                }
            });
            document.querySelectorAll('.listing-toolbar strong').forEach(element => {
                const match = originalPageText.get(element)?.match(/^(\d+) properties found$/);
                if (match) element.textContent = nextLanguage === 'zh' ? `${match[1]} 套房源` : `${match[1]} properties found`;
            });
            document.querySelectorAll('select option').forEach(option => {
                const original = option.dataset.originalText || option.textContent.trim();
                option.dataset.originalText = original;
                if (nextLanguage === 'zh') option.textContent = pageTranslations[original] || original;
                else option.textContent = original;
            });
            const searchInput = document.querySelector('#site-search-input');
            if (searchInput) searchInput.placeholder = nextLanguage === 'zh' ? '按名称、区域或房产类型搜索' : 'Search by name, district or property type';
            languageToggle.classList.toggle('is-zh', nextLanguage === 'zh');
            localStorage.setItem('ss-property-language', nextLanguage);
            requestAnimationFrame(() => {
                const mainAfter = document.querySelector('main')?.getBoundingClientRect().top;
                const shift = mainAfter - mainBefore;
                window.scrollTo(0, Math.max(0, scrollBefore + shift));
            });
        };
        languageToggle?.addEventListener('click', () => setLanguage(languageToggle.dataset.language === 'en' ? 'zh' : 'en'));
        if (localStorage.getItem('ss-property-language') === 'zh') setLanguage('zh');

        const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
        const mainNavigation = document.querySelector('.main-nav');
        mobileMenuToggle?.addEventListener('click', () => {
            const isOpen = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
            mobileMenuToggle.setAttribute('aria-expanded', String(!isOpen));
            mobileMenuToggle.setAttribute('aria-label', isOpen ? 'Open navigation' : 'Close navigation');
            mainNavigation?.classList.toggle('is-open', !isOpen);
        });

        document.querySelectorAll('.listing-card').forEach(card => {
            const title = card.querySelector('h3');
            if (!title) return;
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'link');
            const open = () => { window.location.href = '/property/' + encodeURIComponent(title.textContent.trim()); };
            card.addEventListener('click', event => { if (!event.target.closest('button')) open(); });
            card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
        });
    </script>
</body>
</html>

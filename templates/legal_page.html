{% extends "base.html" %}
{% block title %}{{ title }} | SS Property{% endblock %}
{% block content %}
<section class="legal-page">
    <header class="legal-page-heading">
        <p class="eyebrow">{{ eyebrow }}</p>
        <h1>{{ title }}</h1>
        <p>{{ intro }}</p>
    </header>
    <div class="legal-page-content">
        {% for section in sections %}
        <section>
            <h2>{{ section.title }}</h2>
            <p>{{ section.text }}</p>
        </section>
        {% endfor %}
    </div>
</section>
{% endblock %}
